name: Collector regression tests
on:
  pull_request:
  push:
    branches: ['fix/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install collector dependency
        run: npm install --no-audit --no-fund
      - name: Run app and game collector tests
        run: npm test
