<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Official mobile app chart snapshots across seven countries." />
  <title>Mobile App Charts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">OFFICIAL CHART TRACKER</p>
        <h1>Mobile App Charts</h1>
        <p class="lede">한국·미국·일본·중국·프랑스·호주·독일의 공식 모바일 앱 차트를 주간·월간·국가·카테고리별로 탐색합니다.</p>
      </div>
      <div class="hero-badges">
        <span>공식 소스만</span>
        <span>7개국</span>
        <span>TOP 25</span>
      </div>
    </header>

    <section class="notice" id="coverageNotice" aria-live="polite"></section>

    <nav class="tabs" aria-label="보기 방식">
      <button class="tab active" data-view="country">국가별</button>
      <button class="tab" data-view="weekly">주간</button>
      <button class="tab" data-view="monthly">월간</button>
      <button class="tab" data-view="category">카테고리별</button>
      <button class="tab" data-view="coverage">수집 상태</button>
    </nav>

    <section class="filters">
      <label>스토어
        <select id="storeFilter">
          <option value="apple">Apple App Store</option>
          <option value="google">Google Play</option>
        </select>
      </label>
      <label>국가
        <select id="countryFilter"></select>
      </label>
      <label>카테고리
        <select id="categoryFilter">
          <option value="all">전체</option>
        </select>
      </label>
      <label>기준 스냅샷
        <select id="dateFilter"></select>
      </label>
    </section>

    <section class="metrics" id="metrics"></section>
    <section id="content"></section>

    <footer>
      <p>Rankings are stored only when they can be verified from official Apple App Store or Google Play public pages. Third-party ranking sites are intentionally excluded.</p>
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
